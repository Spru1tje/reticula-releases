name: release

# Publish a release:   git tag v2.13.0 && git push origin v2.13.0
# (or Actions -> release -> Run workflow, with the tag). The tag must match __version__ in app/mfs/__init__.py.
# 1. the tests run   2. Windows installer + macOS (Apple Silicon) dmg are built and self-tested   3. a GitHub release is created.
# A job that waits for a runner simply queues; there is nothing to schedule or retry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v2.13.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/mfs/__init__.py').read()).group(1))")"
          if [ "v$VER" != "$TAG" ]; then echo "Tag $TAG does not match app/mfs/__init__.py version $VER" >&2; exit 1; fi
          test -f "RELEASE_NOTES_v$VER.md" || { echo "RELEASE_NOTES_v$VER.md is missing" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "version=$VER" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [prepare, tests]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-build.txt
      - name: Python packages
        run: pip install -r requirements-build.txt
      - name: Tesseract OCR (bundled in the app for scale-bar labels)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "tesseract.exe not found in $src" }
          Copy-Item $src -Destination tesseract -Recurse
          if (-not (Test-Path "tesseract\tessdata\eng.traineddata")) { New-Item -ItemType Directory -Force tesseract\tessdata | Out-Null; Copy-Item pkg\tessdata\eng.traineddata tesseract\tessdata\ }
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean pkg/mfs_win.spec
      - name: Self-test of the built app (headless)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Reticula\Reticula.exe" -ArgumentList "--selftest","$PWD\selftest.json" -Wait -PassThru
          python pkg/check_selftest.py selftest.json
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVer=${{ needs.prepare.outputs.version }}" "/DSourceDir=$PWD\dist\Reticula" pkg\mfs.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist_installer
      - name: Checksum
        shell: pwsh
        run: |
          $f = "dist_installer\Reticula_Setup_${{ needs.prepare.outputs.version }}.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $f -Leaf) | Out-File -Encoding ascii dist_installer\Reticula_Setup_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist_installer/Reticula_Setup_*.exe
            dist_installer/Reticula_Setup_SHA256.txt
            selftest.json
            selftest_pretty.txt

  macos:
    needs: [prepare, tests]
    runs-on: macos-latest           # Apple Silicon
    timeout-minutes: 120
    env:
      RETICULA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Official Python 3.12 (framework build with Tcl/Tk)
        run: |
          set -euo pipefail
          for v in 3.12.12 3.12.11 3.12.10 3.12.9 3.12.8 3.12.7; do
            url="https://www.python.org/ftp/python/${v}/python-${v}-macos11.pkg"
            if curl -fsI "$url" >/dev/null; then curl -L --retry 5 -o /tmp/python.pkg "$url"; break; fi
          done
          test -f /tmp/python.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"
      - name: Tesseract and dylibbundler
        run: brew install tesseract dylibbundler
      - name: Python packages
        run: |
          python3.12 -m pip install --upgrade pip wheel setuptools
          python3.12 -m pip install -r requirements-build.txt
      - name: Icon and Tesseract bundle
        run: |
          bash pkg/make_icns.sh
          bash pkg/bundle_tesseract.sh
      - name: PyInstaller
        run: |
          python3.12 -m PyInstaller --noconfirm --clean pkg/mfs_mac.spec
          codesign --force --deep --sign - dist/Reticula.app || true
      - name: Self-test of the built app (headless)
        run: |
          set -euo pipefail
          dist/Reticula.app/Contents/MacOS/Reticula --selftest "$PWD/selftest.json" || true
          python3.12 pkg/check_selftest.py selftest.json
      - name: DMG
        run: |
          bash pkg/make_dmg.sh
          ls -lh Reticula_*_macOS_*.dmg*
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            Reticula_*_macOS_*.dmg
            Reticula_*_macOS_*.dmg.sha256
            selftest.json
            selftest_pretty.txt

  publish:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          cat windows/Reticula_Setup_SHA256.txt macos/*.sha256 > SHA256SUMS.txt
          cp ../pkg/README_macOS.txt README_macOS.txt
          cd ..
          FILES=(assets/windows/Reticula_Setup_${VER}.exe assets/macos/Reticula_${VER}_macOS_*.dmg assets/SHA256SUMS.txt assets/README_macOS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "Reticula ${VER}" --notes-file "RELEASE_NOTES_v${VER}.md"
          else
            gh release create "$TAG" "${FILES[@]}" --title "Reticula ${VER}" --notes-file "RELEASE_NOTES_v${VER}.md"
          fi
