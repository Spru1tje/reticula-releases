# Reticula 2.11.0 macOS build.
# This file lives on main because GitHub only runs `schedule` from the default
# branch. The application source stays on the mac-build branch and is checked
# out below. Keep main otherwise empty (LICENSE + this workflow).
name: macOS build

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: reticula-macos-2.11
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cheap gate: after the dmg is on the release, scheduled runs must not
  # request a scarce macOS runner.
  gate:
    name: Already published?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Skip if Reticula_2.11.0_macOS_arm64.dmg is already on v2.11.0
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names="$(gh release view v2.11.0 --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          echo "$names"
          if printf '%s\n' "$names" | grep -qx 'Reticula_2.11.0_macOS_arm64.dmg'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Reticula_2.11.0_macOS_arm64.dmg is already on v2.11.0 — nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "The macOS dmg is not on the release yet; the macOS job will run."
          fi

  macos-arm64:
    name: macOS arm64 (macos-latest)
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RETICULA_VERSION: "2.11.0"
    steps:
      - name: Checkout v2.11.0 source (mac-build)
        uses: actions/checkout@v4
        with:
          ref: mac-build

      - name: Install official Python 3.12 (framework build, includes Tcl/Tk)
        run: |
          set -euo pipefail
          for v in 3.12.12 3.12.11 3.12.10 3.12.9 3.12.8 3.12.7; do
            url="https://www.python.org/ftp/python/${v}/python-${v}-macos11.pkg"
            if curl -fsI "$url" >/dev/null; then
              echo "Downloading Python $v"
              curl -L --retry 5 -o /tmp/python.pkg "$url"
              break
            fi
          done
          if [[ ! -f /tmp/python.pkg ]]; then
            echo "No python.org 3.12 pkg found" >&2
            exit 1
          fi
          sudo installer -pkg /tmp/python.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.12/bin"
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3.12" -c "import sys,tkinter; print(sys.version); print('tk', tkinter.TkVersion)"

      - name: Install tesseract and dylibbundler
        run: |
          brew install tesseract dylibbundler
          tesseract --version | head -2

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('requirements.txt', 'requirements-mac.txt') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Install Python packages
        run: |
          set -euo pipefail
          python3.12 -m pip install --upgrade pip wheel setuptools
          python3.12 -m pip install -r requirements.txt -r requirements-mac.txt
          python3.12 -c "import streamlit, numpy, scipy, matplotlib, pymatgen, tkinter, pytesseract, streamlit_image_coordinates, h5py; print('imports ok')"

      - name: Build icon, bundle tesseract
        run: |
          set -euo pipefail
          bash pkg/make_icns.sh
          bash pkg/bundle_tesseract.sh

      - name: PyInstaller
        run: |
          set -euo pipefail
          python3.12 -m PyInstaller --noconfirm --clean pkg/mfs_mac.spec
          echo "---- dist layout ----"
          find dist -maxdepth 5 \( -type d -o -name 'Reticula' -o -name '*.app' \) | head -80
          ls -la dist/ || true
          if [[ -d dist/Reticula.app ]]; then
            codesign --force --deep --sign - dist/Reticula.app || true
            codesign -dv --verbose=2 dist/Reticula.app || true
          fi

      - name: Launcher selftest (headless)
        run: |
          set -euo pipefail
          BIN="dist/Reticula.app/Contents/MacOS/Reticula"
          if [[ ! -x "$BIN" ]]; then
            echo "expected binary missing; layout:" >&2
            find dist -iname 'Reticula*' | head -50 >&2
            exit 1
          fi
          OUT="$PWD/selftest.json"
          "$BIN" --selftest "$OUT" || true
          if [[ ! -s "$OUT" ]]; then
            echo "selftest produced no output file" >&2
            exit 1
          fi
          python3.12 pkg/check_selftest.py "$OUT"

      - name: Make DMG
        run: |
          set -euo pipefail
          bash pkg/make_dmg.sh
          ls -lh Reticula_2.11.0_macOS_*.dmg*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reticula_2.11.0_macOS_arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            Reticula_2.11.0_macOS_arm64.dmg
            Reticula_2.11.0_macOS_arm64.dmg.sha256
            README_macOS.txt
            selftest.json
            selftest_pretty.txt

      - name: Attach dmg and README to the v2.11.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f Reticula_2.11.0_macOS_arm64.dmg
          test -f README_macOS.txt
          gh release upload v2.11.0 \
            Reticula_2.11.0_macOS_arm64.dmg \
            README_macOS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
