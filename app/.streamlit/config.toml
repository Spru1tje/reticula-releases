[server]
headless = true          # no first-run e-mail prompt; the launcher opens the browser
maxUploadSize = 500
address = "localhost"    # only reachable from this computer

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"            # v2.20: dark is the default; white is optional in Settings
primaryColor = "#8FC5E3"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
linkColor = "#93C5FD"
borderColor = "#334155"
font = "sans-serif"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#16325A"
textColor = "#E6EEF8"
primaryColor = "#8FC5E3"
borderColor = "#22406B"
